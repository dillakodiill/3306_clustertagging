<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Fraud Detector SE2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,sans-serif}
#map{background:#d9dde1}
.panel{position:absolute;z-index:3000;top:10px;left:10px;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.22);font-size:13px;width:290px;max-width:calc(100vw - 45px)}
.panel select{width:100%;margin-top:6px;padding:6px}
.status{margin-top:6px;font-size:11px;color:#555}
.legend{margin-top:7px;line-height:1.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid #333}
.assignment-label{font-size:10px;font-weight:700;color:#111;background:rgba(255,255,255,.92);border:1px solid #555;border-radius:3px;padding:2px 4px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
.sls-label{font-size:10px;font-weight:700;color:#8b0000;background:rgba(255,255,255,.9);border:1px solid #c33;border-radius:3px;padding:2px 4px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<b>Peta Fraud Detector SE2026</b>
<div>Mode: <span id="mode">Cluster</span></div>
<select id="enumFilter"><option value="">Semua Enumerator</option></select>
<div class="status" id="status">Memuat...</div>
<div class="legend">
Zoom &lt; 14: cluster<br>
Zoom 14–15: cluster + batas SLS<br>
Zoom ≥ 16: assignment + batas SLS + label<br>
<span class="dot" style="background:#00e676"></span>Assignment &nbsp;
<span class="dot" style="background:#ff1744"></span>Batas SLS
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA='./data/';
const map=L.map('map',{preferCanvas:true,maxZoom:20,zoomControl:true}).setView([-7.72,110],10);

map.createPane('slsPane'); map.getPane('slsPane').style.zIndex=450;
map.createPane('assignmentPane'); map.getPane('assignmentPane').style.zIndex=500;
map.createPane('labelPane'); map.getPane('labelPane').style.zIndex=650;

const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'});
L.control.layers({'Satellite':sat,'OpenStreetMap':osm}).addTo(map);

let clusters=[], assignments=null, sls=null;
let clLayer=null, aLayer=null, aLabels=null, sLayer=null, sLabels=null;
let filter='', loadingA=false, loadingS=false;

const $=x=>document.getElementById(x);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const json=r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()};

function setStatus(x){$('status').textContent=x}

fetch(DATA+'clusters.json').then(json).then(d=>{
 clusters=d;
 [...new Set(d.map(x=>x.e).filter(Boolean))].sort().forEach(e=>{
  let o=document.createElement('option');o.value=e;o.textContent=e;$('enumFilter').appendChild(o)
 });
 drawClusters();setStatus(d.length+' cluster');
}).catch(e=>setStatus('Gagal memuat cluster: '+e));

function drawClusters(){
 if(clLayer)map.removeLayer(clLayer);
 clLayer=L.layerGroup();
 clusters.forEach(c=>{
  if(filter&&c.e!==filter)return;
  let r=Math.max(8,Math.min(25,6+Math.sqrt(c.u)*2));
  let m=L.circleMarker([c.lat,c.lon],{radius:r,weight:2,fillOpacity:.75,opacity:.95});
  m.bindPopup('<b>CLUSTER</b><br>Enumerator: '+esc(c.e)+'<br>Bangunan unik: <b>'+c.u+'</b><br>Total assignment/KK: '+c.s+'<br>Lat: '+c.lat+'<br>Lon: '+c.lon);
  clLayer.addLayer(m);
 });
 clLayer.addTo(map);
}

function ensureA(){
 if(assignments||loadingA)return;
 loadingA=true;setStatus('Memuat assignment...');
 fetch(DATA+'assignments.json').then(json).then(d=>{
  assignments=d;loadingA=false;drawAssignments()
 }).catch(e=>{loadingA=false;setStatus('Gagal memuat assignment: '+e)})
}
function ensureS(){
 if(sls||loadingS)return;
 loadingS=true;setStatus('Memuat batas SLS...');
 fetch(DATA+'sls.json').then(json).then(d=>{
  sls=d;loadingS=false;drawSLS()
 }).catch(e=>{loadingS=false;setStatus('Gagal memuat SLS: '+e)})
}

function drawSLS(){
 if(!sls)return;
 if(sLayer)map.removeLayer(sLayer);
 sLayer=L.geoJSON(sls,{
  pane:'slsPane',
  style:{color:'#ff0000',weight:2,opacity:1,fillColor:'#ff0000',fillOpacity:0},
  onEachFeature:(f,l)=>{
   const p=f.properties||{};
   l.bindPopup('<b>SLS</b><br>Kecamatan: '+esc(p.k)+'<br>Desa: '+esc(p.d)+'<br>SLS: '+esc(p.s)+'<br>ID SLS: '+esc(p.i));
  }
 }).addTo(map);
 drawSLSLabels();
}

function center(g){
 let q=[];
 if(g.type==='Polygon')q=g.coordinates[0]||[];
 else if(g.type==='MultiPolygon'&&g.coordinates[0])q=g.coordinates[0][0]||[];
 if(!q.length)return null;
 let x=0,y=0;q.forEach(p=>{x+=p[0];y+=p[1]});
 return [y/q.length,x/q.length];
}
function drawSLSLabels(){
 if(sLabels)map.removeLayer(sLabels);
 sLabels=null;
 if(!sls||map.getZoom()<14)return;
 sLabels=L.layerGroup();
 const b=map.getBounds().pad(.05);
 sls.features.forEach(f=>{
  let c=center(f.geometry);if(!c||!b.contains(c))return;
  let p=f.properties||{};
  L.marker(c,{pane:'labelPane',interactive:false,icon:L.divIcon({className:'sls-label',html:esc(p.k)+' | '+esc(p.d)+' | '+esc(p.s),iconSize:null})}).addTo(sLabels);
 });
 sLabels.addTo(map);
}

function labelOverlap(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)}

function drawAssignments(){
 if(!assignments)return;
 if(aLayer)map.removeLayer(aLayer);
 if(aLabels)map.removeLayer(aLabels);
 aLayer=L.layerGroup();aLabels=L.layerGroup();
 const bounds=map.getBounds().pad(.08), candidates=[];
 assignments.forEach(a=>{
  if(filter&&a.e!==filter)return;
  if(!bounds.contains([a.la,a.lo]))return;
  const m=L.circleMarker([a.la,a.lo],{
   pane:'assignmentPane',radius:6,weight:2,color:'#004d40',fillColor:'#00e676',fillOpacity:.95,opacity:1
  });
  m.bindPopup(
   '<b>ASSIGNMENT</b><br>'+
   'Level 6 Full Code: <b>'+esc(a.l)+'</b><br>'+
   'No Bangunan: <b>'+esc(a.b)+'</b><br>'+
   'Assignment ID: '+esc(a.a)+'<br>'+
   'Nama: '+esc(a.n)+'<br>'+
   'Jenis: '+esc(a.t)+'<br>'+
   'Enumerator: '+esc(a.e)+'<br>'+
   'Accuracy: '+(a.ac??'-')+' m'
  );
  aLayer.addLayer(m);candidates.push(a);
 });
 aLayer.addTo(map);

 if(map.getZoom()>=16){
  const used=[], z=map.getZoom();
  const max=z>=18?candidates.length:(z>=17?Math.min(600,candidates.length):Math.min(250,candidates.length));
  candidates.slice().sort((a,b)=>a.la-b.la).slice(0,max).forEach(a=>{
   const pt=map.latLngToContainerPoint([a.la,a.lo]);
   const txt=esc(a.l)+' | '+esc(a.b);
   const w=Math.min(280,Math.max(100,txt.length*5.8+10)),h=19;
   const box={left:pt.x+7,right:pt.x+7+w,top:pt.y-h/2,bottom:pt.y+h/2};
   if(used.some(u=>labelOverlap(box,u)))return;
   used.push(box);
   L.marker([a.la,a.lo],{
    pane:'labelPane',interactive:false,
    icon:L.divIcon({className:'assignment-label',html:txt,iconSize:[w,h],iconAnchor:[-7,h/2]})
   }).addTo(aLabels);
  });
  aLabels.addTo(map);
 }
 setStatus(`${candidates.length} assignment terlihat | ${assignments.length} total`);
}

function mode(){
 const z=map.getZoom();
 if(z<14){
  $('mode').textContent='Cluster';
  if(aLayer)map.removeLayer(aLayer);if(aLabels)map.removeLayer(aLabels);
  if(sLayer)map.removeLayer(sLayer);if(sLabels)map.removeLayer(sLabels);
  drawClusters();return;
 }
 if(z<16){
  $('mode').textContent='Cluster + SLS';
  if(aLayer)map.removeLayer(aLayer);if(aLabels)map.removeLayer(aLabels);
  if(clLayer)clLayer.addTo(map);
  ensureS();if(sls)drawSLS();return;
 }
 $('mode').textContent='Assignment + SLS';
 if(clLayer)map.removeLayer(clLayer);
 ensureA();ensureS();
 if(assignments)drawAssignments();
 if(sls)drawSLS();
}

map.on('zoomend',mode);
map.on('moveend',()=>{
 if(map.getZoom()>=14&&sls)drawSLSLabels();
 if(map.getZoom()>=16&&assignments)drawAssignments();
});
$('enumFilter').addEventListener('change',e=>{
 filter=e.target.value;
 if(map.getZoom()<16)drawClusters();else if(assignments)drawAssignments();
});
mode();
</script>
</body>
</html>
